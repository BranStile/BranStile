name: Refresh profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    paths:
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  refresh-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BranStile
          outputs: |
            assets/contribution-snake.svg?color_snake=%23DA50FA&color_dots=%23231B2A,%23756325,%23AA912F,%23D0B53F,%23FADA50&color_dot_border=%23392B43
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save updated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution snake"
            git push
          fi
